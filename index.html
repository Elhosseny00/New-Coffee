<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Coffee Is a beverage made from roasted coffee beans."
    />
    <meta name="keywords" content="coffee, cafe, beverage, roasted beans" />
    <meta name="theme-color" content="#603a27" />
    <!-- Toolbar color for mobile browsers -->
    <meta name="msapplication-TileColor" content="#ffffff" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/normalize.css" />
    <link rel="stylesheet" href="CSS/all.min.css" />
    <title>Coffee Cafe</title>
  </head>
  <body>
    <div class="cart">
      <div class="cart-header">
        <div class="container">
          <h2>Your Coffee Here!</h2>
          <i class="close fa-solid fa-xmark"></i>
        </div>
      </div>
    </div>
    <div class="landing">
      <header>
        <div class="container">
          <div class="logo">
            <p>Coffee Cafe</p>
          </div>
          <div class="right-side">
            <nav id="nav"></nav>
            <div class="btn">
              <div class="btn-line"></div>
              <div class="btn-line"></div>
              <div class="btn-line"></div>
            </div>
            <i class="cart-icon fa-solid fa-cart-shopping"></i>
          </div>
        </div>
      </header>
      <div class="content">
        <div class="container">
          <div class="text">
            <h1>Coffee Cafe</h1>
            <h2>Savor The Perfect Brew!</h2>
            <p>
              "Start your day with the perfect cup. Our coffee is crafted from
              freshly roasted beans to bring you rich flavor, bold aroma, and a
              moment of pure comfort in every sip."
            </p>
            <a href="#shop">Order Now!</a>
          </div>
        </div>
      </div>
    </div>
    <div class="corr">
      <div class="container">
        <div class="text">
          <h3>
            "Coffee Without a <br />
            Croissant Means Nothing."
          </h3>
        </div>
      </div>
    </div>
    <script src="JS/logic.js"></script>
  </body>
</html>
